<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3A 洋將球探評分工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1A2B; --ink2:#1B2B45; --paper:#F4F6FA; --card:#FFFFFF;
  --line:#DCE3EC; --mute:#5C6B80; --blue:#1C64F2; --orange:#F08A24;
  --good:#1A7F5A; --bad:#C2410C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8EDF5; --ink2:#C3CEDE; --paper:#0B121E; --card:#121D2E;
  --line:#243448; --mute:#8699B2; --blue:#5B92FF; --orange:#F7A74B;
  --good:#3FBF8F; --bad:#F08A5D; color-scheme:dark;}}
:root[data-theme="dark"]{--ink:#E8EDF5;--ink2:#C3CEDE;--paper:#0B121E;--card:#121D2E;
  --line:#243448;--mute:#8699B2;--blue:#5B92FF;--orange:#F7A74B;--good:#3FBF8F;--bad:#F08A5D;color-scheme:dark}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,.dsp{font-family:Archivo,"Noto Sans TC",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}
header{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top,0px)}
.hwrap{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.dot{width:13px;height:13px;border-radius:3px;background:var(--orange)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{font:inherit;font-weight:500;border:0;background:none;color:var(--mute);padding:6px 12px;
  border-radius:7px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
nav button:focus-visible,.row:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:20px 18px 70px}
.grid{display:grid;grid-template-columns:258px 1fr;gap:20px;align-items:start}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px}
.fil{padding:14px 15px}
.fil h3{font-size:12px;font-weight:600;color:var(--blue);margin:0 0 10px;letter-spacing:.04em}
.fil+.fil{border-top:1px solid var(--line)}
.f{margin:0 0 11px}
.f label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.f label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:3px 10px;border:1px solid var(--line);background:transparent;
  color:var(--mute);border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0}
.sw{width:34px;height:19px;border-radius:99px;border:1px solid var(--line);background:var(--paper);
  position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:99px;
  background:var(--mute);transition:transform .15s,background .15s}
.sw[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.sw[aria-pressed="true"]::after{transform:translateX(15px);background:#fff}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}
.bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.bar h2{font-size:21px}
.bar .n{color:var(--mute);font-size:13px}
.bar .sp{margin-left:auto;display:flex;gap:7px}
.btn{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
th{text-align:right;font-weight:600;font-size:11.5px;color:var(--mute);padding:9px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--card)}
th:first-child,th.l{text-align:left}
th[data-on]{color:var(--blue)}
td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--blue) 6%,transparent)}
.pname{font-weight:600}
.sub{color:var(--mute);font-size:11.5px;font-weight:400}
.pill{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600}
.pill.o{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--bad)}
.pill.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.mini{display:inline-block;width:54px;height:6px;border-radius:99px;background:var(--line);
  vertical-align:middle;margin-right:7px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--blue)}
.mini.hi i{background:var(--orange)}
.star{border:0;background:none;cursor:pointer;color:var(--line);font-size:15px;padding:0 2px;line-height:1}
.star[aria-pressed="true"]{color:var(--orange)}
.empty{padding:42px 16px;text-align:center;color:var(--mute)}
/* 球探卡 */
.card{padding:18px}
.chead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:16px}
.chead h2{font-size:25px;line-height:1.15}
.sc3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
@media(max-width:620px){.sc3{grid-template-columns:1fr}}
.sc{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--paper)}
.sc.hero{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sc.hero .k,.sc.hero .pr{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.sc .k{font-size:11.5px;color:var(--mute);font-weight:600}
.sc .v{font-size:33px;font-weight:600;line-height:1.05;margin:1px 0 2px}
.sc .pr{font-size:12px;color:var(--mute)}
.sc .track{height:5px;border-radius:99px;background:color-mix(in srgb,var(--mute) 25%,transparent);margin-top:8px;overflow:hidden}
.sc .track i{display:block;height:100%;background:var(--blue)}
.sc.hero .track i{background:var(--orange)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:14px}
.box h3{font-size:13px;margin-bottom:9px}
.box table{min-width:0;font-size:12.5px}
.box th{position:static}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lgd{font-size:12px;display:grid;gap:3px}
.lgd span{display:flex;align-items:center;gap:6px;color:var(--mute)}
.sq{width:9px;height:9px;border-radius:2px;flex:none}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.stack{display:flex;height:17px;border-radius:5px;overflow:hidden;font-size:10.5px;color:#fff;margin:6px 0 3px}
.stack div{display:flex;align-items:center;justify-content:center}
footer{max-width:1240px;margin:0 auto;padding:0 18px 40px;color:var(--mute);font-size:12px;line-height:1.75}
.note{background:color-mix(in srgb,var(--orange) 9%,transparent);border:1px solid color-mix(in srgb,var(--orange) 32%,transparent);
  border-radius:9px;padding:11px 13px;font-size:12.5px;margin-bottom:18px}
.cmp{overflow-x:auto}
.cmp table{min-width:520px}
.cmp td,.cmp th{text-align:center}
.cmp td.l,.cmp th.l{text-align:left}
</style>
</head>

  </nav>
</div></header>
<main id="app"></main>

let sortK="pit", sortD=-1, star=new Set(), view="lb", cur=D[0].id;

const fmt=(v,d=0)=>v==null?"—":Number(v).toFixed(d);
const topV=p=>{const f=p.mix.filter(m=>m.t=="FF"||m.t=="SI");return f.length?Math.max(...f.map(m=>m.v)):0};
const hasW=p=>p.mix.some(m=>m.s!=null&&m.s>=110&&m.u>=10);

function pass(p){
  if(p.pit<F.pitMin) return false;
  if(p.gap!=null&&p.gap<F.gapMin) return false;
  if(topV(p)<F.vMin) return false;
  if(F.role=="sp"&&!(p.gs>=10)) return false;
  if(F.role=="rp"&&p.gs>=10) return false;
  if(F.hand!="all"&&p.throws!=F.hand) return false;
  if(p.age!=null&&p.age>F.ageMax) return false;
  if((p.ip||0)<F.ipMin) return false;
  if(F.off40&&p.on40) return false;
  if(F.weapon&&!hasW(p)) return false;
  if(p.pitches<F.samp) return false;
  if(F.bb=="gb"&&!(p.gb>=45)) return false;
  if(F.bb=="fb"&&!(p.fb>=32)) return false;
  return true;
}
const rows=()=>D.filter(pass).sort((a,b)=>{
  const x=a[sortK],y=b[sortK];
  if(x==null) return 1; if(y==null) return -1;

function csv(){
  const r=rows(), h=["投手","投","年齡","聯盟","局數","ERA","ERA+","FIP","FIP PR","Stuff+","Location+","Pitching+","Pitching+ PR","落差","球數"];

function donut(mix){
  let a=0,p=[];const R=44,C=2*Math.PI*R;
  mix.forEach(m=>{const f=m.u/100;p.push(`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${PC[m.t]||'#94A3B8'}"
    stroke-width="22" stroke-dasharray="${(C*f).toFixed(1)} ${C}" stroke-dashoffset="${(-C*a).toFixed(1)}"
    transform="rotate(-90 60 60)"></circle>`);a+=f;});
  return `<svg viewBox="0 0 120 120" width="118" height="118" role="img" aria-label="球種比例">${p.join("")}
   <text x="60" y="56" text-anchor="middle" font-size="19" font-weight="600" fill="currentColor" font-family="IBM Plex Mono">${mix.length}</text>
   <text x="60" y="71" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">種球路</text></svg>`;
}

function cp(){

  const R=[["年齡","age"],["局數","ip"],["ERA","era"],["ERA+","eraplus"],["FIP","fip"],["FIP PR","fipPR"],
    ["Stuff+","stuff"],["Location+","loc"],["Pitching+","pit"],["Pitching+ PR","pitPR"],["落差","gap"],
    ["K%","kp"],["BB%","bbp"],["對左打 Pitching+","vsL"],["對右打 Pitching+","vsR"],["滾地球%","gb"],["球數","pitches"]];
  return `<div class="bar"><h2>候選比較</h2><span class="n">${s.length} 位</span>

     const vals=s.map(p=>p[k]); const nums=vals.filter(v=>v!=null);
     const best=["era","fip","bbp"].includes(k)?Math.min(...nums):Math.max(...nums);
     return `<tr><td class="l">${l}</td>${s.map(p=>`<td class="num"${p[k]==best&&nums.length>1?' style="font-weight:600;color:var(--blue)"':''}>${p[k]==null?"—":p[k]}</td>`).join("")}</tr>`;
   }).join("")}</tbody></table></div>`;
}

function mt(){
  return `<div class="panel card" style="max-width:760px">
   <h2 style="font-size:21px;margin-bottom:12px">這些分數怎麼算的</h2>
   <div class="box"><h3>三個分數</h3>
    <p><b>Stuff+</b>　只看球本身的物理特性：球速、位移、轉速、出手點、延伸、出手角度，以及與主要直球的差異。不看投到哪裡、也不看結果。</p>
    <p><b>Location+</b>　只看進壘位置：在同球種、同球數、同手或異手對決下，這個位置比平均好或差多少。</p>
    <p><b>Pitching+</b>　兩者的綜合。100 ＝ 3A 平均，每 10 分 ＝ 1 個標準差。</p></div>
   <div class="box"><h3>建模方式</h3>
    <p>目標變數是每顆球造成的「本局預期失分」變化（Savant 的 delta_run_exp），取負號後代表這顆球幫投手減少多少失分。</p>
    <p>球種分 5 組（直球、卡特、變化球、變速／指叉、蝴蝶球），每組各建一條脊迴歸。Location+ 則依「球種 × 球數狀態 × 同異手」分成 40 個區塊，每個區塊把進壘位置切成 20 × 20 格，樣本少的格子以 30 球的權重往區塊平均拉回。</p>
    <p>分數用 <b>out-of-fold</b> 計算：依投手分 5 折，每位投手的分數都由「沒看過他」的模型預測，避免樣本內高估。</p></div>
   <div class="box"><h3>這個版本的限制</h3>
    <p>只用 <b>2026 年單季、80 位投手、133,942 球</b>（投滿約 300 個打席者的一部分）。原始規劃是 2023–2026 年約 271 萬球，樣本補齊後分數會變動。</p>
    <p>基準與 PR 都只在這 80 人之內計算，不是真正的全 3A 百分位。</p>
    <p>線性模型學不到「球質 × 位置」的加乘效果；蝴蝶球只有 589 球，分數不準。</p>
    <p>看管跑者只有次數，還沒換算成每 100 個可盜壘打席的比率。傷病紀錄尚未納入。</p></div>
   <div class="box"><h3>資料來源</h3>
    <p>Baseball Savant 小聯盟逐球資料（<span class="num">statcast-search-minors</span>，3A，2026 例行賽）；MLB Stats API（成績、40 人名單、盜壘與牽制）。</p></div></div>`;
}

function draw(){
  ["lb","cd","cp","mt"].forEach(v=>document.getElementById("nav-"+v).setAttribute("aria-current",String(v==view)));
  document.getElementById("app").innerHTML={lb,cd,cp,mt}[view]();
  document.getElementById("foot").innerHTML=
   `資料：Baseball Savant 3A 逐球（2026 例行賽）、MLB Stats API　·　分數為 out-of-fold 預測，基準為本頁 80 位投手　·　樣本僅單季，與完整版（2023–2026、約 271 萬球）會有差異`;
}
const h=location.hash.slice(1); if(["lb","cd","cp","mt"].includes(h)) view=h;
draw();
</script>
